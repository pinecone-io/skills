  - id: create-index-live
    setup: |
      pip install -q pinecone==10.0.0
      python3 -c "
      from pinecone import Pinecone
      pc = Pinecone()
      if pc.indexes.exists('test-index-fts'):
          pc.indexes.delete('test-index-fts')
          print('cleaned up stale test-index-fts')
      else:
          print('no leftover index, clean start')
      "
    intent: |
      Create a Pinecone FTS index named `test-index-fts` with this minimal schema:
        - `title`: FTS-enabled string
        - `body`: FTS-enabled string

      I also want to filter by `year` (a number) and `category` (a string) later — don't add
      either of those to the schema itself. A managed index rejects ANY schema-declared
      filterable metadata field with a 400, whether it's a plain string, a float, a boolean, or
      a string_list — `year` and `category` should just be included on upserted documents
      instead, where they auto-index for filtering with nothing to configure. The created
      schema itself should have only the two FTS fields above.

      After creating, poll until ready (`status.ready: true`), then print the resolved
      schema by calling `pc.indexes.describe('test-index-fts')`.

      Save your script as `create.py` and EXECUTE it (this is a live task; don't just
      write the file). Use `python create.py` or `python3 create.py` once written.
    category: code-gen
    env: ["PINECONE_API_KEY"]
    verify: |
      python3 -c "
      from pinecone import Pinecone
      pc = Pinecone()
      assert pc.indexes.exists('test-index-fts'), 'INDEX MISSING'
      d = pc.indexes.describe('test-index-fts')
      print(f'name: {d.name}')
      print(f'ready: {d.status.ready}')
      print(f'fields: {sorted(d.schema.fields.keys())}')
      "
    teardown: |
      python3 -c "
      from pinecone import Pinecone
      pc = Pinecone()
      if pc.indexes.exists('test-index-fts'):
