      context_refs: ["baseline-doc.md"]
      criteria: |
        PASS requires the verify output to show all three of:
        - `name: test-index-fts`
        - `ready: True`
        - `fields:` listing exactly the two expected names alphabetically: `body`, `title` —
          NOT `year`, NOT `category`. Confirmed live: the real server rejects `float`,
          `string_list`, and plain filterable `string` schema fields with the same 400 as a
          plain filterable string, so a correct agent never gets either into the schema.

        FAIL if:
        - verify exits non-zero (index missing or describe failed) — note this includes the
          case where the agent declared `year` or `category` (in any schema-declarable form,
          including `add_float_field`) in the schema, since the real server rejects that with a
          400 at create time and the index would never exist for `verify` to find
